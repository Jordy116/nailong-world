# 奶龍世界 (Nailong World) — Android CI/CD Pipeline
#
# Triggers:
#   - Push to main or developer branch
#   - Pull Request targeting main or developer branch
#
# Stages:
#   1. Checkout code
#   2. Set up JDK 17
#   3. Grant Gradle execution permission
#   4. Run lint checks
#   5. Build Debug APK
#   6. Upload APK as artifact

name: Android CI — Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout ──
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2: Set up JDK 17 ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ── Step 3: Cache Gradle dependencies ──
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Step 4: Grant execution permission ──
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # ── Step 5: Run lint check ──
      - name: Run lint checks
        run: ./gradlew lintDebug

      # ── Step 6: Build Debug APK ──
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ── Step 7: Upload APK as artifact ──
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nailong-world-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
